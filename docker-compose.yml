# Coolify docker-compose deployment.
#
# Bind-mount du volume docker `outil-coiffure-data` (créé par l'app outil-coiffure
# sur le même hôte) directement par son path host. Pourquoi pas le service
# "named volume external" : Coolify préfixe automatiquement les volume names avec
# l'UUID de l'app, ce qui crée un volume isolé au lieu de partager celui d'outil-
# coiffure. Le bind-mount court-circuite ce comportement.

services:
  photo-picker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - PICKER_DB_PATH=/data/photo-picker.db
      - OUTIL_DB_PATH=/data/salons.db
      - HERO_IMAGES_DIR=/data/hero-images
      - SCREENSHOTS_DIR=/data/screenshots
      - SITE_PUBLIC_URL=https://monsitehq.com
      # PICKER_PASSWORD et SESSION_SECRET sont passés par Coolify (panneau env vars)
    volumes:
      - /var/lib/docker/volumes/outil-coiffure-data/_data:/data
    # Labels Traefik manuels : Coolify ne les auto-génère pas en compose mode pour
    # les services qui ne déclarent pas explicitement leur FQDN. On copie le pattern
    # d'outil-coiffure pour router picker.monsitehq.com → port 4000 + redirect http→https.
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.gzip-jcw0.compress=true"
      - "traefik.http.middlewares.redirect-to-https-jcw0.redirectscheme.scheme=https"
      # HTTP → redirect HTTPS
      - "traefik.http.routers.http-picker.entryPoints=http"
      - "traefik.http.routers.http-picker.rule=Host(`picker.monsitehq.com`)"
      - "traefik.http.routers.http-picker.middlewares=redirect-to-https-jcw0"
      - "traefik.http.routers.http-picker.service=https-picker"
      # HTTPS
      - "traefik.http.routers.https-picker.entryPoints=https"
      - "traefik.http.routers.https-picker.rule=Host(`picker.monsitehq.com`)"
      - "traefik.http.routers.https-picker.tls=true"
      - "traefik.http.routers.https-picker.tls.certresolver=letsencrypt"
      - "traefik.http.routers.https-picker.middlewares=gzip-jcw0"
      - "traefik.http.routers.https-picker.service=https-picker"
      # Service → port interne du container
      - "traefik.http.services.https-picker.loadbalancer.server.port=4000"
    networks:
      - coolify

networks:
  coolify:
    external: true
