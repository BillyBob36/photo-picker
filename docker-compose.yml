# Coolify docker-compose deployment.
#
# Bind-mount du volume docker `outil-coiffure-data` (créé par l'app outil-coiffure
# sur le même hôte) directement par son path host. Pourquoi pas le service
# "named volume external" : Coolify préfixe automatiquement les volume names avec
# l'UUID de l'app, ce qui crée un volume isolé au lieu de partager celui d'outil-
# coiffure. Le bind-mount court-circuite ce comportement.

services:
  photo-picker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - PICKER_DB_PATH=/data/photo-picker.db
      - OUTIL_DB_PATH=/data/salons.db
      - HERO_IMAGES_DIR=/data/hero-images
      - SCREENSHOTS_DIR=/data/screenshots
      - SITE_PUBLIC_URL=https://monsitehq.com
      # PICKER_PASSWORD et SESSION_SECRET sont passés par Coolify (panneau env vars)
    volumes:
      - /var/lib/docker/volumes/outil-coiffure-data/_data:/data
